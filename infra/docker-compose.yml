# Aplikasi Pendaftaran Beasiswa Pelatihan — orkestrasi seluruh service.
#
# ATURAN ISOLASI JARINGAN (CLAUDE.md §6 aturan #9) — JANGAN DILANGGAR:
# Hanya `frontend` dan `api-gateway` yang boleh punya `ports:`. Seluruh service backend
# dan database memakai `expose` saja, sehingga tidak bisa dihubungi dari host maupun dari
# luar jaringan docker. Inilah yang mewujudkan persyaratan private VPC.
#
# Service backend mempercayai header identitas (X-User-Id / X-User-Role) yang dipasang
# API Gateway. Kalau mereka bisa ditembak langsung dari luar, siapa pun tinggal mengirim
# header itu sendiri dan seluruh model keamanan runtuh. Menambahkan `ports:` ke salah satu
# service backend "supaya gampang debugging" akan membatalkan jaminan tersebut — pakai
# `docker compose exec` untuk debugging.

name: beasiswa

services:
  # ============================================================
  # DATABASE — hanya di network internal, tanpa ports
  # ============================================================
  db-rbac:
    image: mysql:8.0
    container_name: beasiswa-db-rbac
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi}
      MYSQL_DATABASE: db_rbac
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER wajib diisi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi}
    expose:
      - "3306"
    volumes:
      - db-rbac-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-master:
    image: mysql:8.0
    container_name: beasiswa-db-master
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi}
      MYSQL_DATABASE: db_master
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER wajib diisi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi}
    expose:
      - "3306"
    volumes:
      - db-master-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-transaksi:
    image: mysql:8.0
    container_name: beasiswa-db-transaksi
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi}
      MYSQL_DATABASE: db_transaksi
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER wajib diisi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD wajib diisi}
    expose:
      - "3306"
    volumes:
      - db-transaksi-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-dokumen:
    image: postgres:16-alpine
    container_name: beasiswa-db-dokumen
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_dokumen
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
    expose:
      - "5432"
    volumes:
      - db-dokumen-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d db_dokumen"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clamav:
    image: clamav/clamav:latest
    container_name: beasiswa-clamav
    restart: unless-stopped
    expose:
      - "3310"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "clamscan", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3


  # ============================================================
  # MAILHOG — uji email tanpa SMTP sungguhan
  # ============================================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: beasiswa-mailhog
    restart: unless-stopped
    # Tanpa ports: UI MailHog diakses lewat `docker compose port` atau exec, bukan
    # dipublish ke host, agar aturan isolasi tetap konsisten.
    ports:
      - "8025:8025"
    expose:
      - "1025"
      - "8025"
    networks:
      - internal

  # ============================================================
  # SERVICE BACKEND — internal saja, TIDAK BOLEH punya ports
  # ============================================================
  service-rbac:
    build:
      context: ../service-rbac
      dockerfile: Dockerfile
    container_name: beasiswa-service-rbac
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: service-rbac
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db-rbac:3306/db_rbac
      JWT_PRIVATE_KEY_PATH: /run/secrets/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/public.pem
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@beasiswa.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    expose:
      - "3001"
    volumes:
      # Private key JWT HANYA di-mount ke service ini (ADR-005), read-only.
      - ${JWT_PRIVATE_KEY_HOST:?JWT_PRIVATE_KEY_HOST wajib diisi}:/run/secrets/private.pem:ro
      - ${JWT_PUBLIC_KEY_HOST:?JWT_PUBLIC_KEY_HOST wajib diisi}:/run/secrets/public.pem:ro
    networks:
      - internal
    depends_on:
      db-rbac:
        condition: service_healthy

  service-master:
    build:
      context: ../service-master
      dockerfile: Dockerfile
    container_name: beasiswa-service-master
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: service-master
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db-master:3306/db_master
    expose:
      - "3002"
    networks:
      - internal
    depends_on:
      db-master:
        condition: service_healthy

  service-transaksi:
    build:
      context: ../service-transaksi
      dockerfile: Dockerfile
    container_name: beasiswa-service-transaksi
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: service-transaksi
      PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db-transaksi:3306/db_transaksi
      SERVICE_MASTER_URL: http://service-master:3002
      SERVICE_DOKUMEN_URL: http://service-dokumen:3004
    expose:
      - "3003"
    networks:
      - internal
    depends_on:
      db-transaksi:
        condition: service_healthy
      service-master:
        condition: service_healthy
      service-dokumen:
        condition: service_healthy

  service-dokumen:
    build:
      context: ../service-dokumen
      dockerfile: Dockerfile
    container_name: beasiswa-service-dokumen
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: service-dokumen
      PORT: 3004
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-dokumen:5432/db_dokumen?schema=public
      STORAGE_PATH: /storage/permohonan
      MAX_FILE_SIZE_KB: 2048
      CLAMAV_ENABLED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SERVICE_TRANSAKSI_URL: http://service-transaksi:3003
    expose:
      - "3004"
    volumes:
      # Persistent volume WAJIB (CLAUDE.md §6 aturan #14). Tanpa ini seluruh berkas
      # peserta hilang pada redeploy pertama.
      - dokumen-storage:/storage/permohonan
    networks:
      - internal
    depends_on:
      db-dokumen:
        condition: service_healthy

  # ============================================================
  # API GATEWAY — satu-satunya backend yang menyentuh network public
  # ============================================================
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: beasiswa-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_NAME: api-gateway
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_PUBLIC_KEY_PATH: /run/secrets/public.pem
      JWT_ISSUER: ${JWT_ISSUER:-beasiswa-rbac}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-beasiswa-app}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_UMUM_PER_MENIT: ${RATE_LIMIT_UMUM_PER_MENIT:-100}
      RATE_LIMIT_AUTH_PER_MENIT: ${RATE_LIMIT_AUTH_PER_MENIT:-10}
      RATE_LIMIT_UPLOAD_PER_MENIT: ${RATE_LIMIT_UPLOAD_PER_MENIT:-20}
      SERVICE_RBAC_URL: http://service-rbac:3001
      SERVICE_MASTER_URL: http://service-master:3002
      SERVICE_TRANSAKSI_URL: http://service-transaksi:3003
      SERVICE_DOKUMEN_URL: http://service-dokumen:3004
    expose:
      - "8080"
    volumes:
      # HANYA public key. Gateway tidak pernah memegang private key (ADR-005).
      - ${JWT_PUBLIC_KEY_HOST:?JWT_PUBLIC_KEY_HOST wajib diisi}:/run/secrets/public.pem:ro
    networks:
      - public
      - internal
    depends_on:
      service-rbac:
        condition: service_healthy
      service-master:
        condition: service_healthy
      service-transaksi:
        condition: service_healthy
      service-dokumen:
        condition: service_healthy

  # ============================================================
  # FRONTEND — publik
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: beasiswa-frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - public
    depends_on:
      api-gateway:
        condition: service_healthy

  # ============================================================
  # NGINX — Reverse Proxy & SSL Termination
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: beasiswa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - public
      - internal
    depends_on:
      - api-gateway
      - frontend

networks:
  # Terhubung ke host. Hanya frontend dan api-gateway yang boleh berada di sini.
  public:
    name: beasiswa-public
    driver: bridge
  # Jaringan privat. internal: true membuat docker TIDAK memasang gateway ke luar,
  # sehingga container di dalamnya tidak punya jalur keluar/masuk dari host.
  internal:
    name: beasiswa-internal
    driver: bridge
    internal: true



volumes:
  db-rbac-data:
    name: beasiswa-db-rbac-data
  db-master-data:
    name: beasiswa-db-master-data
  db-transaksi-data:
    name: beasiswa-db-transaksi-data
  db-dokumen-data:
    name: beasiswa-db-dokumen-data
  dokumen-storage:
    name: beasiswa-dokumen-storage
