<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Internal Pemroses - Portal Beasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(13, 110, 253, 0.12);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: #ffffff;
            padding: 35px 25px 25px 25px;
            text-center;
        }
        .icon-box {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="card login-card mx-auto bg-white">
            
            <div class="login-header text-center">
                <div class="icon-box mb-3 shadow-sm">
                    <i class="bi bi-shield-lock-fill fs-2 text-white"></i>
                </div>
                <h4 class="fw-bold mb-1">Portal Internal</h4>
                <p class="text-white-50 small mb-0">Sistem Pengelola & Seleksi Beasiswa</p>
            </div>

            <div class="card-body p-4">
                
                <div class="alert alert-primary bg-primary-subtle text-primary border-0 d-flex align-items-center small py-2 mb-4" role="alert">
                    <i class="bi bi-info-circle-fill fs-5 me-2 flex-shrink-0"></i>
                    <div>Area khusus pemroses data (Verifikator, Lembaga Seleksi, & Admin).</div>
                </div>

                <form action="#" method="POST">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-secondary small">Username / NIP / Email Internal</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-primary">
                                <i class="bi bi-person-badge-fill"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 bg-light ps-0" id="username" placeholder="Masukkan ID pengguna" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold text-secondary small">Kata Sandi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-primary">
                                <i class="bi bi-key-fill"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 bg-light ps-0" id="password" placeholder="Masukkan password" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="role" class="form-label fw-semibold text-secondary small">Masuk Sebagai (Role Akses)</label>
                        <select class="form-select bg-light" id="role">
                            <option value="verifikator" selected>Verifikator (Seleksi Administrasi)</option>
                            <option value="lembaga_seleksi">Lembaga Seleksi (Wawancara)</option>
                            <option value="admin">Administrator System</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small text-secondary" for="rememberMe">
                                Ingat Saya
                            </label>
                        </div>
                        <a href="#" class="small text-decoration-none text-primary fw-semibold">Lupa Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-login w-100 mb-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Masuk Dashboard
                    </button>

                </form>

            </div>

            <div class="card-footer bg-light border-top-0 p-3 text-center">
                <p class="mb-1 small text-muted">
                    <i class="bi bi-check-circle-fill text-primary me-1"></i>Akses Terenkripsi & Ter-autentikasi
                </p>
                <a href="#" class="small text-decoration-none text-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Kembali ke Halaman Utama
                </a>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
